name: Stillow CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart code for validation
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run audio-tool unit tests
        run: python -m unittest tools/test_audit_sleep_audio.py tools/test_build_audio_candidates.py

      - name: Audit approved sleep audio
        run: python tools/audit_sleep_audio.py

      - name: Verify committed Dart formatting
        run: git diff --exit-code -- lib test
